>1</text><text x="136" y="195.5" font-size="10.5" fill="#94a3b8" text-anchor="start">dice</text><rect x="166" y="182" width="44" height="19" rx="5" fill="#ffffff" stroke="#e4e7ec" stroke-width="1.2" opacity="1"/><text x="188" y="195.5" font-size="12" fill="#1f2937" text-anchor="middle">6</text><text x="218" y="195.5" font-size="10.5" fill="#94a3b8" text-anchor="start">faces</text><text x="30" y="217" font-size="12.5" fill="#5b6472" text-anchor="start" font-weight="600">Op 2</text><rect x="84" y="205" width="44" height="19" rx="5" fill="#ffffff" stroke="#e4e7ec" stroke-width="1.2" opacity="1"/><text x="106" y="218.5" font-size="12" fill="#1f2937" text-anchor="middle">1</text><text x="136" y="218.5" font-size="10.5" fill="#94a3b8" text-anchor="start">dice</text><rect x="166" y="205" width="44" height="19" rx="5" fill="#ffffff" stroke="#e4e7ec" stroke-width="1.2" opacity="1"/><text x="188" y="218.5" font-size="12" fill="#1f2937" text-anchor="middle">6</text><text x="218" y="218.5" font-size="10.5" fill="#94a3b8" text-anchor="start">faces</text><text x="30" y="240" font-size="12.5" fill="#5b6472" text-anchor="start" font-weight="600">Op 3</text><rect x="84" y="228" width="44" height="19" rx="5" fill="#ffffff" stroke="#e4e7ec" stroke-width="1.2" opacity="1"/><text x="106" y="241.5" font-size="12" fill="#1f2937" text-anchor="middle">1</text><text x="136" y="241.5" font-size="10.5" fill="#94a3b8" text-anchor="start">dice</text><rect x="166" y="228" width="44" height="19" rx="5" fill="#ffffff" stroke="#e4e7ec" stroke-width="1.2" opacity="1"/><text x="188" y="241.5" font-size="12" fill="#1f2937" text-anchor="middle">6</text><text x="218" y="241.5" font-size="10.5" fill="#94a3b8" text-anchor="start">faces</text><text x="30" y="263" font-size="12.5" fill="#c2410c" text-anchor="start" font-weight="700">Op 4</text><rect x="84" y="251" width="44" height="19" rx="5" fill="#ffffff" stroke="#ea580c" stroke-width="1.2" opacity="1"/><text x="106" y="264.5" font-size="12" fill="#1f2937" text-anchor="middle">1</text><text x="136" y="264.5" font-size="10.5" fill="#94a3b8" text-anchor="start">dice</text><rect x="166" y="251" width="44" height="19" rx="5" fill="#ffffff" stroke="#ea580c" stroke-width="1.2" opacity="1"/><text x="188" y="264.5" font-size="12" fill="#1f2937" text-anchor="middle">3</text><text x="218" y="264.5" font-size="10.5" fill="#94a3b8" text-anchor="start">faces</text><text x="30" y="286" font-size="12.5" fill="#5b6472" text-anchor="start" font-weight="600">Op 5</text><rect x="84" y="274" width="44" height="19" rx="5" fill="#ffffff" stroke="#e4e7ec" stroke-width="1.2" opacity="1"/><text x="106" y="287.5" font-size="12" fill="#1f2937" text-anchor="middle">1</text><text x="136" y="287.5" font-size="10.5" fill="#94a3b8" text-anchor="start">dice</text><rect x="166" y="274" width="44" height="19" rx="5" fill="#ffffff" stroke="#e4e7ec" stroke-width="1.2" opacity="1"/><text x="188" y="287.5" font-size="12" fill="#1f2937" text-anchor="middle">6</text><text x="218" y="287.5" font-size="10.5" fill="#94a3b8" text-anchor="start">faces</text><text x="30" y="309" font-size="12.5" fill="#5b6472" text-anchor="start" font-weight="600">Op 6</text><rect x="84" y="297" width="44" height="19" rx="5" fill="#ffffff" stroke="#e4e7ec" stroke-width="1.2" opacity="1"/><text x="106" y="310.5" font-size="12" fill="#1f2937" text-anchor="middle">1</text><text x="136" y="310.5" font-size="10.5" fill="#94a3b8" text-anchor="start">dice</text><rect x="166" y="297" width="44" height="19" rx="5" fill="#ffffff" stroke="#e4e7ec" stroke-width="1.2" opacity="1"/><text x="188" y="310.5" font-size="12" fill="#1f2937" text-anchor="middle">6</text><text x="218" y="310.5" font-size="10.5" fill="#94a3b8" text-anchor="start">faces</text><rect x="14" y="344" width="234" height="66" rx="12" fill="#ffffff" stroke="#e4e7ec" stroke-width="1.3" opacity="1"/><rect x="14" y="354" width="5" height="46" rx="2.5" fill="#ea580c" opacity="1"/><text x="36" y="373" font-size="16" fill="#1f2937" text-anchor="start" font-weight="700">Run</text><rect x="30" y="372" width="202" height="30" rx="9" fill="#ea580c" stroke="#ea580c" stroke-width="1.4" opacity="1"/><text x="131.0" y="392.5" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="700">▶  Run this line</text><rect x="286" y="66" width="870" height="116" rx="12" fill="#ffffff" stroke="#e4e7ec" stroke-width="1.3" opacity="1"/><rect x="286" y="76" width="5" height="96" rx="2.5" fill="#ea580c" opacity="1"/><text x="308" y="95" font-size="15" fill="#1f2937" text-anchor="start" font-weight="700">Operations Lab — the Five Focusing Steps</text><text x="308" y="120" font-size="13" fill="#ea580c" text-anchor="start" font-weight="700" letter-spacing="0.5">Step 2 — Exploit</text><text x="308" y="144" font-size="21" fill="#1f2937" text-anchor="start" font-weight="700">Improve the wrong station</text><text x="308" y="170" font-size="14" fill="#5b6472" text-anchor="start">You doubled Operation 2's speed, but the reveal below shows total output barely moved.</text><rect x="308" y="194" width="826" height="52" rx="8" fill="#fffaf0" stroke="#fde3c0" stroke-width="1.2" opacity="1"/><rect x="308" y="194" width="5" height="52" rx="2.5" fill="#b54708" opacity="1"/><text x="326" y="216" font-size="13.2" fill="#7c2d12" text-anchor="start" font-weight="600">Essentially unchanged: 4,197 bottles versus 4,129. Operation 4 is still the 2.0/hr constraint,</text><text x="326" y="236" font-size="13" fill="#7c2d12" text-anchor="start">so the extra speed upstream just piled inventory in front of the bottleneck.</text><rect x="308" y="262" width="826" height="34" rx="8" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1.2" opacity="1"/><text x="324" y="284" font-size="13.5" fill="#3730a3" text-anchor="start" font-weight="700">Explain it:</text><text x="406" y="284" font-size="13.3" fill="#3730a3" text-anchor="start">You doubled Operation 2's speed and total output barely moved — in one sentence, why?</text><rect x="308" y="306" width="826" height="60" rx="8" fill="#ffffff" stroke="#e4e7ec" stroke-width="1.3" opacity="1"/><text x="322" y="330" font-size="13.3" fill="#1f2937" text-anchor="start">Because Operation 4 is still the bottleneck, so making an upstream station faster just builds</text><text x="322" y="350" font-size="13.3" fill="#1f2937" text-anchor="start">inventory in front of it instead of adding any throughput.</text><text x="308" y="388" font-size="12.8" fill="#15803d" text-anchor="start" font-weight="600">✓ Recorded in your completion code — putting it in your own words is what makes the idea stick.</text></svg>