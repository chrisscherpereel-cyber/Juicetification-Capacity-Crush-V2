" text-anchor="middle">1</text><text x="136" y="264.5" font-size="10.5" fill="#94a3b8" text-anchor="start">dice</text><rect x="166" y="251" width="44" height="19" rx="5" fill="#ffffff" stroke="#ea580c" stroke-width="1.2" opacity="1"/><text x="188" y="264.5" font-size="12" fill="#1f2937" text-anchor="middle">3</text><text x="218" y="264.5" font-size="10.5" fill="#94a3b8" text-anchor="start">faces</text><text x="30" y="286" font-size="12.5" fill="#5b6472" text-anchor="start" font-weight="600">Op 5</text><rect x="84" y="274" width="44" height="19" rx="5" fill="#ffffff" stroke="#e4e7ec" stroke-width="1.2" opacity="1"/><text x="106" y="287.5" font-size="12" fill="#1f2937" text-anchor="middle">1</text><text x="136" y="287.5" font-size="10.5" fill="#94a3b8" text-anchor="start">dice</text><rect x="166" y="274" width="44" height="19" rx="5" fill="#ffffff" stroke="#e4e7ec" stroke-width="1.2" opacity="1"/><text x="188" y="287.5" font-size="12" fill="#1f2937" text-anchor="middle">6</text><text x="218" y="287.5" font-size="10.5" fill="#94a3b8" text-anchor="start">faces</text><text x="30" y="309" font-size="12.5" fill="#5b6472" text-anchor="start" font-weight="600">Op 6</text><rect x="84" y="297" width="44" height="19" rx="5" fill="#ffffff" stroke="#e4e7ec" stroke-width="1.2" opacity="1"/><text x="106" y="310.5" font-size="12" fill="#1f2937" text-anchor="middle">1</text><text x="136" y="310.5" font-size="10.5" fill="#94a3b8" text-anchor="start">dice</text><rect x="166" y="297" width="44" height="19" rx="5" fill="#ffffff" stroke="#e4e7ec" stroke-width="1.2" opacity="1"/><text x="188" y="310.5" font-size="12" fill="#1f2937" text-anchor="middle">6</text><text x="218" y="310.5" font-size="10.5" fill="#94a3b8" text-anchor="start">faces</text><rect x="14" y="344" width="234" height="66" rx="12" fill="#ffffff" stroke="#e4e7ec" stroke-width="1.3" opacity="1"/><rect x="14" y="354" width="5" height="46" rx="2.5" fill="#ea580c" opacity="1"/><text x="36" y="373" font-size="16" fill="#1f2937" text-anchor="start" font-weight="700">Run</text><rect x="30" y="372" width="202" height="30" rx="9" fill="#ea580c" stroke="#ea580c" stroke-width="1.4" opacity="1"/><text x="131.0" y="392.5" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="700">▶  Run this line</text><rect x="286" y="66" width="870" height="212" rx="12" fill="#ffffff" stroke="#e4e7ec" stroke-width="1.3" opacity="1"/><rect x="286" y="76" width="5" height="192" rx="2.5" fill="#ea580c" opacity="1"/><text x="308" y="95" font-size="15" fill="#1f2937" text-anchor="start" font-weight="700">Operations Lab — the Five Focusing Steps</text><rect x="308" y="110" width="51.0" height="22" rx="11" fill="#eafaf0" stroke="#e4e7ec" stroke-width="1" opacity="1"/><text x="333.5" y="125" font-size="11.5" fill="#15803d" text-anchor="middle" font-weight="600">Stage</text><rect x="366.0" y="110" width="58.0" height="22" rx="11" fill="#eafaf0" stroke="#e4e7ec" stroke-width="1" opacity="1"/><text x="395.0" y="125" font-size="11.5" fill="#15803d" text-anchor="middle" font-weight="600">Length</text><rect x="431.0" y="110" width="72.0" height="22" rx="11" fill="#eafaf0" stroke="#e4e7ec" stroke-width="1" opacity="1"/><text x="467.0" y="125" font-size="11.5" fill="#15803d" text-anchor="middle" font-weight="600">Identify</text><rect x="510.0" y="110" width="65.0" height="22" rx="11" fill="#ea580c" opacity="1"/><text x="542.5" y="125" font-size="11.5" fill="#ffffff" text-anchor="middle" font-weight="700">Exploit</text><rect x="582.0" y="110" width="93.0" height="22" rx="11" fill="#f1f5f9" stroke="#e4e7ec" stroke-width="1" opacity="1"/><text x="628.5" y="125" font-size="11.5" fill="#94a3b8" text-anchor="middle" font-weight="600">Subordinate</text><rect x="682.0" y="110" width="65.0" height="22" rx="11" fill="#f1f5f9" stroke="#e4e7ec" stroke-width="1" opacity="1"/><text x="714.5" y="125" font-size="11.5" fill="#94a3b8" text-anchor="middle" font-weight="600">Elevate</text><rect x="754.0" y="110" width="79.0" height="22" rx="11" fill="#f1f5f9" stroke="#e4e7ec" stroke-width="1" opacity="1"/><text x="793.5" y="125" font-size="11.5" fill="#94a3b8" text-anchor="middle" font-weight="600">Challenge</text><text x="308" y="162" font-size="13" fill="#ea580c" text-anchor="start" font-weight="700" letter-spacing="0.5">Step 2 — Exploit</text><text x="308" y="186" font-size="21" fill="#1f2937" text-anchor="start" font-weight="700">Improve the wrong station</text><text x="308" y="212" font-size="14" fill="#5b6472" text-anchor="start">Tempting fix: give a busy upstream station more muscle. We double Operation 2 to 2 dice</text><text x="308" y="232" font-size="14" fill="#5b6472" text-anchor="start">(≈ 7.0/hr) while Operation 4 stays the 2.0/hr constraint. What happens to annual output?</text><rect x="308" y="241" width="826" height="26" rx="6" fill="#f8fafc" stroke="#e4e7ec" stroke-width="1" opacity="1"/><text x="316" y="258" font-size="12.5" fill="#1f2937" text-anchor="start" font-weight="700">The setup:</text><text x="388" y="258" font-size="12.5" fill="#5b6472" text-anchor="start">Operation 2 = 2 dice × 6 · Operation 4 still 1 × 3 · no WIP cap · 1 year</text><text x="308" y="304" font-size="14.5" fill="#1f2937" text-anchor="start" font-weight="700">Predict:  You doubled Operation 2's capacity. What happens to annual throughput?</text><circle cx="317" cy="325" r="8.5" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/><text x="336" y="330" font-size="14.5" fill="#5b6472" text-anchor="start">Rises a lot</text><circle cx="317" cy="355" r="8.5" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/><text x="336" y="360" font-size="14.5" fill="#5b6472" text-anchor="start">Rises a little</text><circle cx="317" cy="385" r="8.5" fill="#ffffff" stroke="#ea580c" stroke-width="2"/><circle cx="317" cy="385" r="4.2" fill="#ea580c"/><text x="336" y="390" font-size="14.5" fill="#1f2937" text-anchor="start" font-weight="600">Essentially unchanged</text><circle cx="317" cy="415" r="8.5" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/><text x="336" y="420" font-size="14.5" fill="#5b6472" text-anchor="start">Falls</text><rect x="308" y="444" width="250" height="38" rx="9" fill="#ea580c" stroke="#ea580c" stroke-width="1.4" opacity="1"/><text x="433.0" y="468.5" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="700">▶  Set up &amp; run this step</text><text x="308" y="506" font-size="14" fill="#15803d" text-anchor="start" font-weight="700">✓ Your prediction matched.</text><rect x="308" y="518" width="826" height="76" rx="8" fill="#fffaf0" stroke="#fde3c0" stroke-width="1.2" opacity="1"/><rect x="308" y="518" width="5" height="76" rx="2.5" fill="#b54708" opacity="1"/><text x="326" y="544" font-size="13.5" fill="#7c2d12" text-anchor="start" font-weight="600">Essentially unchanged: 4,197 bottles versus 4,129 before — a rounding error.</text><text x="326" y="566" font-size="13" fill="#7c2d12" text-anchor="start">Operation 4 is still the constraint at ≈ 2.0/hr, so speeding up a non-constraint just piles</text><text x="326" y="585" font-size="13" fill="#7c2d12" text-anchor="start">more inventory in front of it. Throughput is set by the bottleneck, not the busiest station.</text><rect x="308" y="610" width="118" height="32" rx="9" fill="#ffffff" stroke="#e4e7ec" stroke-width="1.4" opacity="1"/><text x="367.0" y="631.5" font-size="15" fill="#1f2937" text-anchor="middle" font-weight="700">‹ Previous</text><text x="721.0" y="631" font-size="12.5" fill="#94a3b8" text-anchor="middle" font-weight="600">Step 4 of 9</text><rect x="1016" y="610" width="118" height="32" rx="9" fill="#ffffff" stroke="#e4e7ec" stroke-width="1.4" opacity="1"/><text x="1075.0" y="631.5" font-size="15" fill="#1f2937" text-anchor="middle" font-weight="700">Next ›</text></svg>