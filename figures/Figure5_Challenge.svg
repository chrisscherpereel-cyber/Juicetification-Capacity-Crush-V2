eight="700">goal:  ≥ 4,000</text><text x="1114" y="283" font-size="17" fill="#1f2937" text-anchor="end" font-weight="800">4,129</text><rect x="308" y="306" width="826" height="42" rx="9" fill="#fef3f2" stroke="#fecdca" stroke-width="1" opacity="1"/><text x="328" y="334" font-size="17" fill="#d92d20" text-anchor="middle" font-weight="800">✗</text><text x="350" y="333" font-size="14.5" fill="#1f2937" text-anchor="start" font-weight="700">Average WIP</text><rect x="606" y="315" width="94.60000000000001" height="23" rx="11.5" fill="#ffffff" stroke="#e4e7ec" stroke-width="1" opacity="1"/><text x="653.3" y="329.5" font-size="12" fill="#5b6472" text-anchor="middle" font-weight="700">goal:  &lt; 50</text><text x="1114" y="333" font-size="17" fill="#1f2937" text-anchor="end" font-weight="800">1,514</text><text x="308" y="364" font-size="12.5" fill="#5b6472" text-anchor="start" font-weight="600">Tries used:  1 of 3</text><rect x="308" y="374" width="826" height="46" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1" opacity="1"/><rect x="308" y="374" width="5" height="46" rx="2.5" fill="#1d4ed8" opacity="1"/><text x="326" y="394" font-size="13.5" fill="#1e3a8a" text-anchor="start" font-weight="700">Not there yet — check the ✗ row above.</text><text x="326" y="413" font-size="12.8" fill="#1e3a8a" text-anchor="start">Hint: throughput is set by the bottleneck, so all that inventory buys nothing. Turn on the WIP cap and set it low.</text><rect x="308" y="432" width="190" height="34" rx="9" fill="#ffffff" stroke="#e4e7ec" stroke-width="1.4" opacity="1"/><text x="403.0" y="454.5" font-size="15" fill="#1f2937" text-anchor="middle" font-weight="700">↺  Reset &amp; try again</text></svg>