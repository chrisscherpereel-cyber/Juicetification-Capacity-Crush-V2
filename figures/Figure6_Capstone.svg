ke="#e4e7ec" stroke-width="1" opacity="1"/><text x="657.0" y="125" font-size="11.5" fill="#94a3b8" text-anchor="middle" font-weight="600">Dx 4</text><rect x="686.0" y="110" width="51.0" height="22" rx="11" fill="#f1f5f9" stroke="#e4e7ec" stroke-width="1" opacity="1"/><text x="711.5" y="125" font-size="11.5" fill="#94a3b8" text-anchor="middle" font-weight="600">Fix 4</text><text x="308" y="162" font-size="13" fill="#4f46e5" text-anchor="start" font-weight="700" letter-spacing="0.5">Case 1 — Diagnose</text><text x="308" y="186" font-size="21" fill="#1f2937" text-anchor="start" font-weight="700">Line A is underperforming</text><text x="308" y="206" font-size="14" fill="#5b6472" text-anchor="start">Line A is finishing far fewer bottles than it should. Run it, read the dashboard, and diagnose it</text><text x="308" y="226" font-size="14" fill="#5b6472" text-anchor="start">from the four causes below — the same four every time.</text><rect x="308.0" y="244" width="153.2" height="52" rx="8" fill="#f8fafc" stroke="#e4e7ec" stroke-width="1" opacity="1"/><text x="320.0" y="262" font-size="11" fill="#94a3b8" text-anchor="start" font-weight="600">Output</text><text x="320.0" y="284" font-size="18" fill="#ea580c" text-anchor="start" font-weight="700">3,106</text><rect x="473.2" y="244" width="153.2" height="52" rx="8" fill="#f8fafc" stroke="#e4e7ec" stroke-width="1" opacity="1"/><text x="485.2" y="262" font-size="11" fill="#94a3b8" text-anchor="start" font-weight="600">Avg WIP</text><text x="485.2" y="284" font-size="18" fill="#0ea5e9" text-anchor="start" font-weight="700">2,102</text><rect x="638.4" y="244" width="153.2" height="52" rx="8" fill="#f8fafc" stroke="#e4e7ec" stroke-width="1" opacity="1"/><text x="650.4" y="262" font-size="11" fill="#94a3b8" text-anchor="start" font-weight="600">Service</text><text x="650.4" y="284" font-size="18" fill="#15803d" text-anchor="start" font-weight="700">100%</text><rect x="803.5999999999999" y="244" width="153.2" height="52" rx="8" fill="#f8fafc" stroke="#e4e7ec" stroke-width="1" opacity="1"/><text x="815.5999999999999" y="262" font-size="11" fill="#94a3b8" text-anchor="start" font-weight="600">Yield</text><text x="815.5999999999999" y="284" font-size="18" fill="#15803d" text-anchor="start" font-weight="700">100%</text><rect x="968.8" y="244" width="153.2" height="52" rx="8" fill="#f8fafc" stroke="#e4e7ec" stroke-width="1" opacity="1"/><text x="980.8" y="262" font-size="11" fill="#94a3b8" text-anchor="start" font-weight="600">Scrap</text><text x="980.8" y="284" font-size="18" fill="#5b6472" text-anchor="start" font-weight="700">0</text><text x="308" y="314" font-size="14.5" fill="#1f2937" text-anchor="start" font-weight="700">What's throttling Line A?</text><circle cx="317" cy="335" r="8.5" fill="#ffffff" stroke="#ea580c" stroke-width="2"/><circle cx="317" cy="335" r="4.2" fill="#ea580c"/><text x="336" y="340" font-size="14.5" fill="#1f2937" text-anchor="start" font-weight="600">A single slow station — a capacity bottleneck</text><circle cx="317" cy="365" r="8.5" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/><text x="336" y="370" font-size="14.5" fill="#5b6472" text-anchor="start">A station scrapping too many units — low yield</text><circle cx="317" cy="395" r="8.5" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/><text x="336" y="400" font-size="14.5" fill="#5b6472" text-anchor="start">An unreliable raw-material supplier</text><circle cx="317" cy="425" r="8.5" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/><text x="336" y="430" font-size="14.5" fill="#5b6472" text-anchor="start">Work-in-process running away — no WIP cap</text><rect x="308" y="452" width="826" height="56" rx="8" fill="#fffaf0" stroke="#fde3c0" stroke-width="1.2" opacity="1"/><rect x="308" y="452" width="5" height="56" rx="2.5" fill="#b54708" opacity="1"/><text x="326" y="476" font-size="13.3" fill="#7c2d12" text-anchor="start" font-weight="600">Capacity bottleneck. Output is only 3,106 and inventory is stacked in front of Operation 4.</text><text x="326" y="497" font-size="13" fill="#7c2d12" text-anchor="start">Service is 100% and yield is 100%, so it isn't the supplier or quality — a station is simply too slow.</text></svg>